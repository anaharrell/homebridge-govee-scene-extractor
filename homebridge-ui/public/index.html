<style>
  .gsl-device { margin-bottom: .75rem; }
  .gsl-scenes { margin: .2rem 0 0 1.4rem; }
  .gsl-scene { margin-bottom: .5rem; }
  .gsl-scene:last-child { margin-bottom: 0; }
  .gsl-meta { font-size: .8rem; }
  .gsl-meta-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: .75rem;
    margin-left: 1.5em;
  }
  .gsl-status { white-space: nowrap; }
  .gsl-remove { padding: 0; flex-shrink: 0; }
  .gsl-icon {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    flex-shrink: 0;
  }

  /* Bootstrap .text-muted stays on the light :root token in this iframe. */
  .card-title,
  .form-check-label {
    color: inherit;
  }

  .text-muted {
    color: inherit !important;
    opacity: 0.7;
  }

  body.dark-mode .btn-link,
  body.dark-mode .btn-link:hover,
  body.dark-mode .btn-link:focus {
    color: inherit;
  }
</style>

<div class="card">
  <div class="card-body">
    <div class="d-flex align-items-center mb-2" style="gap:.65rem">
      <img class="gsl-icon" src="icon.png" width="40" height="40" alt="">
      <h5 class="card-title mb-0">Devices &amp; Scenes</h5>
    </div>
    <p class="text-muted small mb-3">
      Check a device or scene to put it in HomeKit. Tap-to-Run/Scenes across multiple devices will only be one Switch in HomeKit.
    </p>
    <div id="gsl-tree">Loading…</div>
  </div>
</div>

<script>
(function () {
  const tree = document.getElementById('gsl-tree');

  function syncBootstrapTheme() {
    const dark = document.body.classList.contains('dark-mode')
      || document.body.className.indexOf('config-ui-x-dark-mode-') !== -1;
    const theme = dark ? 'dark' : 'light';
    document.documentElement.setAttribute('data-bs-theme', theme);
    document.body.setAttribute('data-bs-theme', theme);
  }

  syncBootstrapTheme();
  new MutationObserver(syncBootstrapTheme).observe(document.body, {
    attributes: true,
    attributeFilter: ['class']
  });

  if (typeof homebridge.userCurrentLightingMode === 'function') {
    homebridge.userCurrentLightingMode().then(mode => {
      if (mode === 'dark')
        document.body.classList.add('dark-mode');
      syncBootstrapTheme();
    }).catch(() => {});
  }

  function lastSeenLine(scene) {
    const seen = scene.lastSeenLabel || 'Unknown';
    if (scene.inLatestDiscovery)
      return `Last seen: ${seen}`;
    return `Last seen: ${seen} (Not seen in latest discovery)`;
  }

  function linkedLine(scene) {
    const names = scene.linkedDevices || [];
    if (scene.published && names.length)
      return `One HomeKit switch; also sends to ${names.join(', ')}`;
    if (scene.ttrPublished && scene.switchOwner && !scene.published)
      return `Linked to HomeKit switch for ${scene.switchOwner}`;
    if (names.length)
      return `Linked: ${names.join(', ')}`;
    return '';
  }

  function statusFor(group, scene) {
    if (scene.published)
      return 'In HomeKit';
    if (scene.ttrPublished)
      return 'Linked in HomeKit';
    if (!scene.associated || !group.associated)
      return 'Not associated';
    if (!group.included)
      return 'Device excluded';
    if (!scene.included)
      return 'Excluded';
    return 'Not published';
  }

  function render(data) {
    const devices = data.devices || [];

    if (!devices.length) {
      tree.innerHTML = '<p class="text-muted mb-0">No devices or scenes learned yet.</p>';
      return;
    }

    tree.innerHTML = devices.map((device, di) => {
      const sku = device.sku
        ? `<div class="text-muted gsl-meta">${escapeHtml(device.sku)}</div>`
        : '';
      const note = device.associated
        ? ''
        : '<div class="text-muted gsl-meta">Not associated yet</div>';
      const deviceDisabled = device.associated ? '' : 'disabled';
      const emptyHint = (device.scenes || []).length
        ? ''
        : '<small class="text-muted gsl-status">No scenes found</small>';
      const scenes = (device.scenes || []).map((scene, si) => `
        <div class="gsl-scene">
          <div class="form-check d-flex justify-content-between align-items-start">
            <div>
              <input class="form-check-input gsl-scene-box" type="checkbox"
                id="scene-${di}-${si}"
                data-device="${escapeAttr(scene.deviceName)}"
                data-scene="${escapeAttr(scene.sceneName)}"
                ${scene.included ? 'checked' : ''}>
              <label class="form-check-label" for="scene-${di}-${si}">
                ${escapeHtml(scene.sceneName)}
              </label>
              ${linkedLine(scene) ? `<div class="text-muted gsl-meta">${escapeHtml(linkedLine(scene))}</div>` : ''}
              ${Number.isInteger(scene.brightness) ? `<div class="text-muted gsl-meta">Brightness: ${scene.brightness}%</div>` : ''}
            </div>
            <small class="text-muted gsl-status">${escapeHtml(statusFor(device, scene))}</small>
          </div>
          <div class="gsl-meta-row">
            <span class="text-muted gsl-meta">${escapeHtml(lastSeenLine(scene))}</span>
            <button type="button" class="btn btn-link btn-sm gsl-remove gsl-delete"
              data-device="${escapeAttr(scene.deviceName)}"
              data-scene="${escapeAttr(scene.sceneName)}">
              Remove
            </button>
          </div>
        </div>
      `).join('');

      return `
        <div class="gsl-device">
          <div class="form-check d-flex justify-content-between align-items-baseline">
            <div>
              <input class="form-check-input gsl-device-box" type="checkbox"
                id="device-${di}"
                data-name="${escapeAttr(device.name)}"
                ${device.included ? 'checked' : ''} ${deviceDisabled}>
              <label class="form-check-label fw-semibold" for="device-${di}">
                ${escapeHtml(device.name)}
              </label>
            </div>
            ${emptyHint}
          </div>
          ${sku}${note}
          ${scenes ? `<div class="gsl-scenes">${scenes}</div>` : ''}
        </div>
      `;
    }).join('');

    tree.querySelectorAll('.gsl-device-box').forEach(box => {
      box.addEventListener('change', () => change({
        kind: 'device',
        name: box.dataset.name,
        included: box.checked
      }));
    });

    tree.querySelectorAll('.gsl-scene-box').forEach(box => {
      box.addEventListener('change', () => change({
        kind: 'scene',
        deviceName: box.dataset.device,
        sceneName: box.dataset.scene,
        included: box.checked
      }));
    });

    tree.querySelectorAll('.gsl-delete').forEach(button => {
      button.addEventListener('click', () => removeScene({
        deviceName: button.dataset.device,
        sceneName: button.dataset.scene
      }));
    });
  }

  function escapeHtml(value) {
    return String(value || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function escapeAttr(value) {
    return escapeHtml(value);
  }

  async function change(payload) {
    try {
      homebridge.showSpinner();
      render(await homebridge.request('/included', payload));
      homebridge.toast.success(
        payload.included ? 'Included' : 'Excluded',
        payload.sceneName || payload.name
      );
    } catch (e) {
      homebridge.toast.error(e.message || 'Could not update inclusion');
      await load();
    } finally {
      homebridge.hideSpinner();
    }
  }

  async function removeScene(payload) {
    try {
      homebridge.showSpinner();
      render(await homebridge.request('/delete', payload));
      homebridge.toast.success('Removed', payload.sceneName);
    } catch (e) {
      homebridge.toast.error(e.message || 'Could not remove scene');
      await load();
    } finally {
      homebridge.hideSpinner();
    }
  }

  async function load() {
    try {
      render(await homebridge.request('/state'));
    } catch (e) {
      tree.innerHTML = `<p class="text-danger mb-0">${escapeHtml(e.message || 'Could not load state')}</p>`;
    }
  }

  load();
})();
</script>
